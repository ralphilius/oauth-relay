name: Publish oauth-relay-client to npm

# npm Trusted Publishing (OIDC): no NPM_TOKEN secret needed. The package's
# Trusted Publisher link on npmjs.com must point at this repo + workflow.
on:
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish @ralphilius/oauth-relay-client
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build client
        run: pnpm --filter @ralphilius/oauth-relay-client build

      - name: Publish to npm (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN — npm CLI >= 11.5.1 exchanges the OIDC token
        # itself when the package's trusted publisher matches this workflow.
        run: |
          cd packages/client
          npm publish --access public --provenance
